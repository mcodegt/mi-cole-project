# App monolítica (Angular build + FastAPI). La BD va en otro compose (recomendado en prod).
#
# ─── Producción (patrón mcflow) ─────────────────────────────────────────────
# 1) Postgres dedicado:
#      cp .env.postgres.example .env.postgres
#      docker compose -f docker-compose.postgres.yml up -d
# 2) backend/.env → DATABASE_HOST=host.docker.internal, DATABASE_PORT=5434, mismas credenciales
# 3) App:
#      docker compose -f docker-compose.prod.yml up -d
#    (o este archivo con build: docker compose up -d --build)
#
# ─── Desarrollo local ────────────────────────────────────────────────────────
# Postgres en el host + app en Docker: `DATABASE_HOST=host.docker.internal` (abajo).
# Esquema: cd mi-cole-docs/sql && python run_schema.py --bootstrap
# Seeds:   cd backend && python -m app.cli seed-superadmin
#
# Perfil rápido todo-en-docker (sin compose.postgres):
#   docker compose --profile local-db up --build
#   backend/.env: DATABASE_HOST=db, DATABASE_PORT=5432, user/pass micole

services:
  app:
    build:
      context: ..
      dockerfile: mi-cole-project/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - backend/.env
    environment:
      STATIC_ROOT: /app/static/browser
      # Sobrescribe DATABASE_HOST del .env para alcanzar Postgres en el host Windows/Mac.
      # RDS / host remoto: comentá la siguiente línea y definí DATABASE_HOST en backend/.env.
      # Con --profile local-db: usá DATABASE_HOST: db
      DATABASE_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: micole
      POSTGRES_PASSWORD: micole
      POSTGRES_DB: micole
    ports:
      - "5432:5432"
    volumes:
      - micole_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micole -d micole"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  micole_pgdata:
