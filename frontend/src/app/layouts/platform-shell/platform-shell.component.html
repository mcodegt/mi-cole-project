<div class="mc-app-shell">
  <div class="mc-app-shell__sidebar">
    <mc-modern-sidebar
      accent="platform"
      brandTitle="CED"
      brandSubtitle="Platform"
      brandIcon="pi pi-server"
      [navItems]="navItems"
      [userName]="auth.session()?.user?.full_name ?? ''"
      [userEmail]="auth.session()?.user?.email ?? ''"
      (logoutClick)="logout()"
    />
  </div>

  <div class="mc-app-shell__main">
    <header class="mc-app-shell__header">
      <p class="text-sm font-medium mc-text">Administración MCodeGT</p>
    </header>
    <main class="mc-app-shell__content">
      <router-outlet />
    </main>
  </div>
</div>
