<div class="mc-app-shell">
  <div class="mc-app-shell__sidebar">
    <mc-modern-sidebar
      accent="staff"
      brandTitle="CED"
      [brandImageUrl]="schoolLogoUrl() ?? undefined"
      [brandSubtitle]="auth.session()?.staff?.school_name ?? 'Staff'"
      [navItems]="navItems()"
      [showSettings]="showOwnerSettings()"
      [settingsActive]="settingsRouteActive()"
      settingsRoute="/app/settings"
      [userName]="auth.session()?.user?.full_name ?? ''"
      [userEmail]="auth.session()?.user?.email ?? ''"
      (logoutClick)="logout()"
    />
  </div>

  <div class="mc-app-shell__main">
    <header class="mc-app-shell__header">
      <div class="flex flex-wrap items-center gap-3">
        @if (restricted()) {
          <span class="rounded-full bg-amber-100 px-3 py-1 text-xs font-medium text-amber-800 dark:bg-amber-900/40 dark:text-amber-200">
            Modo facturación — acceso limitado
          </span>
        }
        <div class="flex items-center gap-2 text-sm">
          <span class="mc-text-muted">Sede</span>
          <p-select
            [options]="campuses()"
            [(ngModel)]="selectedCampusId"
            optionLabel="name"
            optionValue="id"
            (ngModelChange)="onCampusChange()"
            styleClass="w-48"
          />
        </div>
      </div>
      <div class="flex items-center gap-3">
        @if (canSwitchToParent()) {
          <button
            type="button"
            class="text-sm font-medium mc-text-accent hover:underline"
            (click)="switchToParentPortal()"
          >
            Portal padres
          </button>
        }
      </div>
    </header>
    <main class="mc-app-shell__content">
      <router-outlet />
    </main>
  </div>
</div>
